name: CI

on:
  push:
    branches: [ "5-rabbitmq-cicd" ]
  pull_request:
    branches: [ "5-rabbitmq-cicd" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build all Maven services (skip tests)
        run: |
          set -e
          for dir in */; do
            if [ -f "${dir}pom.xml" ]; then
              echo "=== Building ${dir} ==="
              (cd "${dir}" && mvn -B clean package -DskipTests)
            fi
          done
